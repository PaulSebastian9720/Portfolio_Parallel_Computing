[project]
name = "03-aplicacion-computo-paralelo-docker-pycuda"
version = "0.1.0"
description = "Servicio web de convolución de imágenes con PyCUDA en Docker (práctica 03)"
readme = "README.md"
authors = [
    { name = "jennyfer04ramirez", email = "jr.6311.camm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "pycuda==2026.1",
    "python-multipart==0.0.34",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "playwright==1.65.2",
]
